<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../../ds.css">
<style>
  .head{position:absolute;top:52px;left:64px;right:64px;display:flex;align-items:center;justify-content:space-between}
  .h-title{margin:118px 64px 0;font-size:56px;max-width:1040px}
  .rows{position:absolute;left:64px;right:64px;top:280px;display:flex;flex-direction:column;gap:26px}
  .brow{display:grid;grid-template-columns:300px 1fr 170px;align-items:center;gap:26px;background:var(--bg-3);border:1px solid var(--border-1);border-radius:var(--r-lg);padding:24px 28px}
  .brow .name{font-weight:600;font-size:24px;letter-spacing:-.02em}
  .brow .name span{display:block;font-family:var(--font-mono);font-size:13px;font-weight:400;color:var(--text-3);margin-top:6px;letter-spacing:0}
  .track{position:relative;height:3px;background:var(--bg-5);border-radius:2px}
  .fill{position:absolute;left:0;top:-1px;height:5px;background:var(--teal);border-radius:3px;box-shadow:0 0 12px rgba(0,229,199,.35)}
  .brow .num{font-size:52px;text-align:right}
  .note{position:absolute;left:64px;right:64px;bottom:52px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border-1);padding-top:20px}
</style></head>
<body><div class="canvas canvas--16x9">
  <div class="grid-bg"></div><div class="glow" style="width:520px;height:520px;right:-180px;bottom:-200px;opacity:.5"></div>

  <div class="head">
    <div class="logo"><svg class="mk" viewBox="0 0 32 32" role="img" aria-label="M4"><rect class="panel" x="3" y="3" width="26" height="26" rx="8" stroke-width="1.5"/><path class="s" d="M11 12 L16 16 L11 20" stroke-width="2.6"/><rect class="t" x="17" y="19.4" width="6" height="2.4" rx="1.2"/></svg><span class="logo__word">startupbase<span class="up">.uno</span></span></div>
    <div class="eyebrow">Fig 3 · Бенчмарки</div>
  </div>

  <h1 class="title h-title">Три замера, которые чаще всего цитируют</h1>

  <div class="rows">
    <div class="brow">
      <div class="name">MCP-Atlas<span>агентные инструменты</span></div>
      <div class="track"><div class="fill" style="width:89.2%"></div></div>
      <div class="num">89.2</div>
    </div>
    <div class="brow">
      <div class="name">Terminal-Bench 2.1<span>работа в терминале</span></div>
      <div class="track"><div class="fill" style="width:76.4%"></div></div>
      <div class="num">76.4</div>
    </div>
    <div class="brow">
      <div class="name">JobBench<span>прикладные рабочие задачи</span></div>
      <div class="track"><div class="fill" style="width:61.8%"></div></div>
      <div class="num">61.8</div>
    </div>
  </div>

  <div class="note">
    <div class="footer-note">Вторичные данные: siliconangle.com · latent.space</div>
    <div class="footer-note">в блоге Meta таблица опубликована изображением</div>
  </div>
</div></body></html>
