name: decode-assets
# ВРЕМЕННЫЙ workflow (v5): декодирует бинарные ассеты, положенные в репозиторий
# как base64 (_assets_b64/** зеркалит целевую структуру путей).
# v5: set +e (иначе bash -e обрывает шаг до публикации причины), полная диагностика.
on:
  push:
    paths:
      - '_assets_b64/**'
      - '.github/workflows/decode-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Debug event
        shell: bash
        run: |
          set +e
          echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF ref_name=$GITHUB_REF_NAME sha=$GITHUB_SHA"
          echo "repo=$GITHUB_REPOSITORY actor=$GITHUB_ACTOR"
          echo "shell flags: $SHELLOPTS"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode base64 assets
        shell: bash
        run: |
          set +e
          n=0
          while IFS= read -r f; do
            out="${f#_assets_b64/}"; out="${out%.b64}"
            mkdir -p "$(dirname "$out")"
            base64 -d "$f" > "$out"
            echo "  $? $f -> $out ($(stat -c%s "$out" 2>/dev/null) bytes, $(file -b --mime-type "$out" 2>/dev/null))"
            n=$((n+1))
          done < <(find _assets_b64 -name '*.b64' | sort)
          echo "decoded: $n"

      - name: Commit and push
        shell: bash
        run: |
          set +e
          git config user.name "startupbase-bot"
          git config user.email "nagin@leadupmarketers.com"
          git add -A -- ':!_assets_b64'
          echo "add rc=$?"
          git status --porcelain | head -40
          git commit -m "assets: decode binary assets" 2>&1 | head -20
          echo "commit rc=${PIPESTATUS[0]}"
          echo "HEAD=$(git rev-parse HEAD)"

          OUT=$(git push origin HEAD:main 2>&1); RC=$?
          echo "push rc=$RC"
          echo "$OUT"

          if [ "$RC" -ne 0 ]; then
            M=$(printf '%s' "$OUT" | tr '\n' ' ' | tr -d '\r' | sed 's/%/%25/g' | cut -c1-850)
            echo "::error title=GITPUSH_RC$RC::$M"

            API=$(curl -s -o /tmp/api.json -w '%{http_code}' -X PUT -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/_diag.txt" -d '{"message":"diag","content":"ZGln","branch":"main"}')
            A=$(tr '\n' ' ' < /tmp/api.json | tr -d '\r' | sed 's/%/%25/g' | cut -c1-850)
            echo "api http=$API $A"
            echo "::error title=API_HTTP_$API::$A"

            echo "--- repo permissions seen by token ---"
            curl -s -o /tmp/perm.json -w 'perm http=%{http_code}\n' -H "Authorization: Bearer ${GITHUB_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}"
            python3 -c 'import json;d=json.load(open("/tmp/perm.json"));print("permissions:",json.dumps(d.get("permissions")));print("private:",d.get("private"),"default_branch:",d.get("default_branch"))'

            echo "--- branch protection / rulesets ---"
            curl -s -o /tmp/prot.json -w 'protection http=%{http_code}\n' -H "Authorization: Bearer ${GITHUB_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main/protection"
            head -c 400 /tmp/prot.json
            echo
            curl -s -o /tmp/rs.json -w 'rulesets http=%{http_code}\n' -H "Authorization: Bearer ${GITHUB_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/rulesets"
            head -c 400 /tmp/rs.json
            echo
            exit 1
          fi

          echo "pushed OK $(git rev-parse HEAD)"
