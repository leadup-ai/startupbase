name: decode-assets
# ВРЕМЕННЫЙ workflow (v2, с диагностикой): декодирует бинарные ассеты, положенные
# в репозиторий как base64 (_assets_b64/** зеркалит целевую структуру путей).
# Если пуш не проходит — причина публикуется как annotation check-run (логи недоступны).
on:
  push:
    paths:
      - '_assets_b64/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 assets
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r f; do
            out="${f#_assets_b64/}"; out="${out%.b64}"
            mkdir -p "$(dirname "$out")"
            base64 -d "$f" > "$out"
            echo "  $f -> $out ($(stat -c%s "$out") bytes, $(file -b --mime-type "$out"))"
            n=$((n+1))
          done < <(find _assets_b64 -name '*.b64' | sort)
          echo "decoded: $n"
      - name: Commit decoded assets
        run: |
          set -uo pipefail
          git config user.name  "startupbase-bot"
          git config user.email "nagin@leadupmarketers.com"
          git add -A -- ':!_assets_b64'
          git commit -m "assets: decode binary assets"
          echo "--- token info ---"
          echo "GITHUB_TOKEN present: $([ -n "${GITHUB_TOKEN:-}" ] && echo yes || echo no)"
          echo "repo: $GITHUB_REPOSITORY  actor: $GITHUB_ACTOR"
          set +e
          OUT=$(git push 2>&1); RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            MSG=$(printf '%s' "$OUT" | tr '\n' ' ' | tr -d '\r' | sed 's/%/%25/g' | cut -c1-900)
            echo "::error title=DIAG-GITPUSH-RC$RC::$MSG"
            API=$(curl -s -o /tmp/api.json -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/_diag.txt" \
              -d '{"message":"diag","content":"ZGln","branch":"main"}')
            echo "::error title=DIAG-API-HTTP-$API::$(tr '\n' ' ' < /tmp/api.json | tr -d '\r' | sed 's/%/%25/g' | cut -c1-900)"
            exit 1
          fi
          echo "pushed OK"
